# CD: push/main or manual → SSH into VPS → git sync + docker compose redeploy
name: Deploy VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "screenshots/**"
      - ".cursor/**"
      - "e2e/**"
      - "test-results/**"
  workflow_dispatch:

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Validate required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets: GitHub → Settings → Secrets and variables → Actions"
            echo "On VPS: bash scripts/setup-github-deploy-key.sh"
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 40m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR='${{ secrets.VPS_APP_DIR }}'
            if [ -z "$APP_DIR" ]; then
              APP_DIR=/opt/project-dashboard
            fi
            export APP_DIR
            export BRANCH=main
            export CI=1
            export SKIP_UFW=1

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: $APP_DIR is not a git checkout."
              echo "Bootstrap once on the server: bash scripts/deploy-vps.sh"
              exit 1
            fi

            if [ ! -f "$APP_DIR/.env" ]; then
              echo "ERROR: missing $APP_DIR/.env on server (do not commit .env)."
              exit 1
            fi

            cd "$APP_DIR"
            bash scripts/deploy-vps.sh

      - name: Public health check
        env:
          VPS_HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
        run: |
          if [ -z "${VPS_HEALTH_URL:-}" ]; then
            echo "Skipping public health check (VPS_HEALTH_URL not set)."
            exit 0
          fi
          echo "Checking $VPS_HEALTH_URL"
          ok=0
          for i in $(seq 1 24); do
            code=$(curl -fsS -o /tmp/health.json -w "%{http_code}" "$VPS_HEALTH_URL" || true)
            if [ "$code" = "200" ]; then
              echo "Health OK"
              cat /tmp/health.json || true
              echo
              ok=1
              break
            fi
            echo "attempt $i -> HTTP ${code:-000}"
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Public health check failed"
            exit 1
          fi
