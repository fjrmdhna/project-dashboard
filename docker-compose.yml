services:
  postgres:
    image: postgres:15-alpine
    container_name: project_dashboard_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-project_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Localhost only; laptop access goes through an SSH tunnel.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - project_dashboard_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-project_user} -d ${POSTGRES_DB:-project_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: project_dashboard_redis
    # No host ports — internal only
    volumes:
      - redis_data:/data
    networks:
      - project_dashboard_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgrest:
    image: postgrest/postgrest:v12.2.8
    container_name: project_dashboard_postgrest
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-project_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-project_dashboard}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_DB_AGGREGATE_FUNCTIONS: "true"
      PGRST_OPENAPI_SERVER_PROXY_URI: ${NEXT_PUBLIC_SUPABASE_URL}/rest/v1
    ports:
      # Bound to localhost only for nginx reverse proxy
      - "127.0.0.1:3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - project_dashboard_network
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-project-dashboard-app:local}
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: project_dashboard_app
    extra_hosts:
      - "nd-dashboard.cloud:192.168.200.1"
    ports:
      # Dockerfile/Cloud Run image listens on PORT=8080 inside the container
      - "8080:8080"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=postgresql://${POSTGRES_USER:-project_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-project_dashboard}
      - REDIS_URL=redis://redis:6379
      - UPLOADS_DIR=/data/uploads
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgrest:
        condition: service_started
    networks:
      - project_dashboard_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  project_dashboard_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
          gateway: 192.168.200.1
